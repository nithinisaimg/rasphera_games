<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/dice_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - The Game Is On, But This Page Isn't | RASPHERA Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #EAE8E3;
        font-family: 'Plus Jakarta Sans', sans-serif;
        color: #171412;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px;
        overflow-x: hidden;
      }
      .card {
        position: relative;
        width: 100%;
        max-width: 900px;
        border-radius: 24px;
        border: 4px solid #171412;
        box-shadow: 12px 12px 0px #171412;
        background: #ffffff;
        overflow: hidden;
      }
      .card-img-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 1024 / 575;
      }
      .card-img-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        user-select: none;
      }
      .btn-container {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
      }
      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background-color: #FF7417;
        color: #ffffff;
        font-family: 'Anton', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-size: 14px;
        padding: 10px 24px;
        border-radius: 12px;
        border: 2px solid #171412;
        box-shadow: 4px 4px 0px #171412;
        text-decoration: none;
        transition: all 0.2s ease;
        cursor: pointer;
      }
      .back-btn:hover {
        background-color: #E65D00;
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0px #171412;
      }
      .back-btn:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0px #171412;
      }
      .subtext {
        margin-top: 18px;
        font-family: 'Caveat', cursive;
        font-size: 16px;
        font-weight: 700;
        color: #38251C;
        text-align: center;
      }
      .subtext a {
        color: #FF7417;
        text-decoration: underline;
      }
      @media (max-width: 640px) {
        .card {
          border-width: 3px;
          border-radius: 16px;
          box-shadow: 8px 8px 0px #171412;
        }
        .btn-container {
          bottom: 12px;
        }
        .back-btn {
          font-size: 12px;
          padding: 8px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-img-wrap">
        <img src="/404.jpg" alt="404 Error - The game is on, but this page isn't." />
        <div class="btn-container">
          <a href="/" class="back-btn" id="home-link">
            <span>←</span>
            <span>BACK TO PLAY AREA</span>
          </a>
        </div>
      </div>
    </div>
    <p class="subtext">
      Lost the game board? <a href="/" id="home-sublink">Return to RASPHERA Landing</a>
    </p>

    <script>
      // Support GitHub Pages subpath if hosted in a repository subdirectory
      const path = window.location.pathname;
      if (path.includes('/rasphera_games/')) {
        document.getElementById('home-link').href = '/rasphera_games/';
        document.getElementById('home-sublink').href = '/rasphera_games/';
      }
    </script>
  </body>
</html>
